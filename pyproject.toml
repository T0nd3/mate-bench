[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by formatter
    "SIM108", # ternary operator — readability preference
    "B008",   # typer.Argument / typer.Option in defaults — idiomatic Typer usage
]

[tool.ruff.lint.per-file-ignores]
"**/cli.py" = ["B904"]          # raise typer.Exit(1) inside except is intentional
"**/_profiles.py" = ["RUF001"]  # × in profile descriptions is intentional
"**/tests/**" = ["RUF003"]      # × in test comments is intentional

[tool.ruff.lint.isort]
known-first-party = [
    "mate_bench",
    "mate_workload_llm",
    "mate_workload_stt",
    "mate_workload_imagegen",
    "mate_engine_ollama",
    "mate_engine_faster_whisper",
    "mate_engine_comfyui",
    "mate_runtime_rocm",
    "mate_runtime_cuda",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
mate-bench = { workspace = true }
mate-runtime-rocm = { workspace = true }
mate-runtime-cuda = { workspace = true }
mate-engine-ollama = { workspace = true }
mate-engine-faster-whisper = { workspace = true }
mate-engine-comfyui = { workspace = true }
mate-workload-llm = { workspace = true }
mate-workload-stt = { workspace = true }
mate-workload-imagegen = { workspace = true }
