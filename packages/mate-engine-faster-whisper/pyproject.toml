[project]
name = "mate-engine-faster-whisper"
version = "0.1.0"
description = "faster-whisper engine plugin for mate-bench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Benjamin Fäuster", email = "benjamin.faeuster@web.de"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "mate-bench>=0.1,<0.2",
    "faster-whisper>=1.0",
]

[project.urls]
Homepage = "https://github.com/T0nd3/mate-bench"
Repository = "https://github.com/T0nd3/mate-bench"

[project.entry-points."mate_bench.engine"]
faster-whisper = "mate_engine_faster_whisper:FasterWhisperEngine"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_engine_faster_whisper"]
