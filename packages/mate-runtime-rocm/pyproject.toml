[project]
name = "mate-runtime-rocm"
version = "0.1.0"
description = "ROCm runtime plugin for mate-bench"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Benjamin Fäuster", email = "benjamin.faeuster@web.de"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "mate-bench>=0.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/T0nd3/mate-bench"
Repository = "https://github.com/T0nd3/mate-bench"

[project.entry-points."mate_bench.runtime"]
rocm = "mate_runtime_rocm:RocmRuntime"

[tool.mate-bench]
requires_mate_bench = ">=0.1,<0.2"
api_version = 1

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_runtime_rocm"]
