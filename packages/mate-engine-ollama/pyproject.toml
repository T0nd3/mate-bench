[project]
name = "mate-engine-ollama"
version = "0.1.0"
description = "Ollama engine plugin for mate-bench"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Benjamin Fäuster", email = "benjamin.faeuster@web.de"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "mate-bench>=0.1,<0.2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/T0nd3/mate-bench"
Repository = "https://github.com/T0nd3/mate-bench"

[project.entry-points."mate_bench.engine"]
ollama = "mate_engine_ollama:OllamaEngine"

[tool.mate-bench]
requires_mate_bench = ">=0.1,<0.2"
api_version = 1

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
markers = ["integration: requires a running Ollama server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_engine_ollama"]
