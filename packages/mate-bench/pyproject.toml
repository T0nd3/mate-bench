[project]
name = "mate-bench"
version = "0.1.0"
description = "Model AI Throughput Evaluator — benchmark local AI workloads"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Benjamin Fäuster", email = "benjamin.faeuster@web.de"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "typer>=0.12",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "httpx>=0.27",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/T0nd3/mate-bench"
Repository = "https://github.com/T0nd3/mate-bench"
Changelog = "https://github.com/T0nd3/mate-bench/releases"

[project.scripts]
mate = "mate_bench.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = ["integration: requires a running Ollama server"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_bench"]
